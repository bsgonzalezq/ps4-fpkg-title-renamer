# GitHub Pages site (https://bsgonzalezq.github.io/ps4-pkg-title-renamer/): the README is the page.
title: PS4 PKG Title Renamer
description: >-
  Rename PS4 .pkg files (base game, patch, DLC) and CUSA title-ID folders to game names
  using param.sfo. Optional title ID, version, region and content ID tags, undo,
  English names for Japanese/Korean titles. Python, Linux/macOS/Windows.
url: https://bsgonzalezq.github.io
baseurl: /ps4-pkg-title-renamer
lang: en
theme: jekyll-theme-cayman
image: /assets/social-preview.png
author: bsgonzalezq
github:
  is_project_page: true
plugins:
  - jekyll-seo-tag     # <title>, meta description, Open Graph / Twitter cards
  - jekyll-sitemap     # sitemap.xml for Google Search Console / Bing Webmaster Tools
# Site ownership for Google Search Console / Bing Webmaster Tools: paste the codes they give
# you ("HTML tag" method, only the content="..." value) and push.
# webmaster_verifications:
#   google: PASTE_GOOGLE_CODE
#   bing: PASTE_BING_CODE
exclude:
  - install_prereqs.sh
  - install_prereqs.ps1
  - requirements.txt
  - "*.py"
  - "*.log"
  - "*.db"
